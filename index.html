<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src https://script.google.com https://*.googleusercontent.com; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="森ポータル">
<meta name="theme-color" content="#2f6f4f">
<title>森酒造場 統合ポータル</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f1ea; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  noscript { display: block; padding: 24px 16px; font: 15px/1.6 sans-serif; }
</style>
</head>
<body>
<noscript>JavaScript を有効にしてください。</noscript>
<iframe id="portal" title="森酒造場 統合ポータル" allow="clipboard-write"></iframe>
<script>
/*
  森酒造場 統合ポータルの入口ページ(2026-11-17 ポータル実行役)
  - iPhone・iPad は、ポータル(Googleの枠の中)に保存したログインの記録を、画面を閉じると消す。
    そこで、このページ(枠の外)に記録を預かる。
  - 預かるのは、ポータルのサーバーが発行した「合言葉」と氏名だけ。PIN は扱わない。URL にも載せない。
  - 受け取るのは、このページが表示しているポータルの枠からの知らせだけ(送り元と枠のつながりを確かめる)。
*/
(function () {
  'use strict';
  var EXEC = 'https://script.google.com/macros/s/AKfycbwBGYfmyxPdgNss7abnbmUF3fGZomZv1dN5_HNniC9p48SeS3Ns9NoSebEIQNLnroz5/exec';   // 本番
  var DEMO = 'https://script.google.com/macros/s/AKfycbxPvQ34Ald8FiKZL-eL7q_9FwxgFNn7cIJoTJyTXWt36xho7zjA-pZjWsp70hQ0foSa/exec';   // デモ(?demo=1 のとき)
  var KEY = 'mori_portal_keep_v1', NKEY = 'mori_portal_name_v1';
  var ID_RE = /^[A-Za-z0-9_-]{1,40}$/;
  var KEEP_RE = /^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/;
  var ORIGIN_RE = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;   // ポータルの画面が動く Google の枠

  var frame = document.getElementById('portal');
  var q = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
    var i = kv.indexOf('=');
    if (i > 0) { try { q[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1)); } catch (e) {} }
  });
  var base = (q.demo === '1' && DEMO.indexOf('__') < 0) ? DEMO : EXEC;
  function load(again, full) {
    var s = (again && ID_RE.test(again)) ? '?again=' + encodeURIComponent(again) + (full ? '&full=1' : '') : '';
    frame.src = base + s;
  }
  load(q.again, false);

  function get(k) { try { return window.localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function put(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
  function del(k) { try { window.localStorage.removeItem(k); } catch (e) {} }

  /* 知らせを送ってきた窓が、このページのポータルの枠の中にあるか(親をたどって確かめる) */
  function fromPortal(w) {
    for (var i = 0; i < 6 && w; i++) {
      if (w === frame.contentWindow) return true;
      if (w === window) return false;
      try { w = w.parent; } catch (e) { return false; }
    }
    return false;
  }

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || typeof d !== 'object' || d.type !== 'mori-portal') return;
    if (!ORIGIN_RE.test(String(e.origin)) || !fromPortal(e.source)) return;
    if (d.op === 'get') {
      e.source.postMessage({ type: 'mori-portal', op: 'keep', token: get(KEY), name: get(NKEY) }, e.origin);
    } else if (d.op === 'set') {
      if (typeof d.token === 'string' && d.token.length < 600 && KEEP_RE.test(d.token)) put(KEY, d.token);
    } else if (d.op === 'clear') {
      del(KEY);
    } else if (d.op === 'name') {
      if (typeof d.name === 'string' && d.name.length < 60) put(NKEY, d.name);
    } else if (d.op === 'home') {
      load(typeof d.again === 'string' ? d.again : '', true);
    }
  });
})();
</script>
</body>
</html>
